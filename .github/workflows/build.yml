name: Build

on:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: write

jobs:
  debug:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Setup Android SDK
        run: yes | sdkmanager "platforms;android-36" "build-tools;36.0.0" >/dev/null 2>&1 || true
      - name: Build debug
        run: ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk

  build-module:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Setup Android SDK
        run: yes | sdkmanager "platforms;android-36" "build-tools;36.0.0" >/dev/null 2>&1 || true
      - name: Decode keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > yfishyon1.jks
          chmod 600 yfishyon1.jks
      - name: Build module APK
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/yfishyon1.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease
      - name: Rename module APK
        run: cp app/build/outputs/apk/release/app-release.apk NeteaseLogin-module.apk
      - name: Create Release + upload module
        uses: softprops/action-gh-release@v2
        with:
          files: NeteaseLogin-module.apk
          body: |
            ## 免责声明
            本模块及修改版客户端仅供学习研究目的。使用者需遵守当地法律法规及对应游戏服务条款。
            作者不对使用本产物造成的任何直接或间接损失负责，风险自负。

            ## ⚠️ 封号风险提示
            使用修改版客户端登录游戏**可能导致账号被封禁**。
            请自行评估风险，强烈建议先用小号测试，勿用主号。

            ## 下载
            - 模块: NeteaseLogin-module.apk（LSPosed 模块，直接安装）
            - 镜像（国内加速）: https://v4.gh-proxy.com/https://github.com/yfishyon/NeteaseIOSLogin/releases/download/${{ github.ref_name }}/NeteaseLogin-module.apk
          generate_release_notes: false
