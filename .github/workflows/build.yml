name: Build

on:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: write

jobs:
  debug:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Setup Android SDK
        run: yes | sdkmanager "platforms;android-36" "build-tools;36.0.0" >/dev/null 2>&1 || true
      - name: Build debug
        run: ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk

  build-module:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Setup Android SDK
        run: yes | sdkmanager "platforms;android-36" "build-tools;36.0.0" >/dev/null 2>&1 || true
      - name: Decode keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > yfishyon1.jks
          chmod 600 yfishyon1.jks
      - name: Build module APK
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/yfishyon1.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease
      - name: Rename module APK
        run: cp app/build/outputs/apk/release/app-release.apk NeteaseLogin-module.apk
      - uses: actions/upload-artifact@v4
        with:
          name: module-apk
          path: NeteaseLogin-module.apk
      - name: Upload module + body to Release
        uses: softprops/action-gh-release@v2
        with:
          files: NeteaseLogin-module.apk
          body: |
            ## 免责声明
            本模块及修改版客户端仅供学习研究目的。使用者需遵守当地法律法规及对应游戏服务条款。
            作者不对使用本产物造成的任何直接或间接损失负责，风险自负。

            ## ⚠️ 封号风险提示
            使用修改版客户端登录游戏**可能导致账号被封禁**。
            请自行评估风险，强烈建议先用小号测试，勿用主号。

            ## 镜像下载地址（国内加速，v4.gh-proxy.com）
            - 模块: https://v4.gh-proxy.com/https://github.com/yfishyon/NeteaseIOSLogin/releases/download/${{ github.ref_name }}/NeteaseLogin-module.apk
            - 第五人格原包 (com.netease.dwrg): https://v4.gh-proxy.com/https://github.com/yfishyon/NeteaseIOSLogin/releases/download/${{ github.ref_name }}/NeteaseLogin-ID5.apk
            - 第五人格共享 (com.netease.dwrg1): https://v4.gh-proxy.com/https://github.com/yfishyon/NeteaseIOSLogin/releases/download/${{ github.ref_name }}/NeteaseLogin-ID5-shared.apk
            - 光遇原包: https://v4.gh-proxy.com/https://github.com/yfishyon/NeteaseIOSLogin/releases/download/${{ github.ref_name }}/NeteaseLogin-Sky.apk
            - 光遇共享: https://v4.gh-proxy.com/https://github.com/yfishyon/NeteaseIOSLogin/releases/download/${{ github.ref_name }}/NeteaseLogin-Sky-shared.apk
            - 蛋仔派对原包: https://v4.gh-proxy.com/https://github.com/yfishyon/NeteaseIOSLogin/releases/download/${{ github.ref_name }}/NeteaseLogin-Party.apk
            - 蛋仔派对共享: https://v4.gh-proxy.com/https://github.com/yfishyon/NeteaseIOSLogin/releases/download/${{ github.ref_name }}/NeteaseLogin-Party-shared.apk
          generate_release_notes: false

  patch:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-module
    strategy:
      max-parallel: 1
      matrix:
        include:
          - game: ID5
            adl: https://adl.netease.com/d/g/id5/c/gw
          - game: Sky
            adl: https://adl.netease.com/d/g/sky/c/gw
          - game: Party
            adl: https://adl.netease.com/d/g/party/c/gw
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Setup Android SDK
        run: yes | sdkmanager "platforms;android-36" "build-tools;36.0.0" >/dev/null 2>&1 || true
      - name: Decode keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > yfishyon1.jks
          chmod 600 yfishyon1.jks
      - name: Download module artifact
        uses: actions/download-artifact@v4
        with:
          name: module-apk
      - name: Parse game APK link
        id: apk
        run: python3 scripts/fetch_game.py "${{ matrix.adl }}"
      - name: Cache game APK
        id: cache
        uses: actions/cache@v4
        with:
          path: cache/game.apk
          key: ${{ matrix.game }}-${{ steps.apk.outputs.name }}
      - name: Download game APK
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p cache
          curl -L --fail -o cache/game.apk "${{ steps.apk.outputs.url }}"
          ls -la cache/game.apk
      - name: Download npatch
        run: |
          mkdir -p npatch
          gh release download -R 7723mod/NPatch -p '*.jar' -D npatch/ || true
          ls -la npatch/
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Read package name
        id: pkg
        run: |
          AAPT=$(command -v aapt || ls $ANDROID_HOME/build-tools/*/aapt 2>/dev/null | head -1)
          PKG=$($AAPT dump badging cache/game.apk | grep -oE "name='[^']+'" | head -1 | sed "s/name='//;s/'//")
          echo "pkg=$PKG" >> $GITHUB_OUTPUT
          echo "shared=${PKG}1" >> $GITHUB_OUTPUT
          echo "package: $PKG -> shared: ${PKG}1"
      - name: Patch 原包名
        run: |
          mkdir -p out
          JAR=$(ls npatch/*.jar | head -1)
          java -jar "$JAR" \
            -m NeteaseLogin-module.apk \
            -k $GITHUB_WORKSPACE/yfishyon1.jks ${{ secrets.KEYSTORE_PASSWORD }} ${{ secrets.KEY_ALIAS }} ${{ secrets.KEY_PASSWORD }} \
            -l 1 -o out/ cache/game.apk
          mv out/*.apk out/NeteaseLogin-${{ matrix.game }}.apk
          ls -la out/
      - name: Patch 共享包名
        run: |
          mkdir -p out2
          JAR=$(ls npatch/*.jar | head -1)
          java -jar "$JAR" \
            -m NeteaseLogin-module.apk \
            -k $GITHUB_WORKSPACE/yfishyon1.jks ${{ secrets.KEYSTORE_PASSWORD }} ${{ secrets.KEY_ALIAS }} ${{ secrets.KEY_PASSWORD }} \
            -l 1 -p ${{ steps.pkg.outputs.shared }} -o out2/ cache/game.apk
          mv out2/*.apk out2/NeteaseLogin-${{ matrix.game }}-shared.apk
          ls -la out2/
      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            out/NeteaseLogin-${{ matrix.game }}.apk
            out2/NeteaseLogin-${{ matrix.game }}-shared.apk
